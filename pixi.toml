[workspace]
authors = ["AtharvaBhorpe <athborpe@gmail.com>"]
channels = ["https://prefix.dev/robostack-humble", "https://prefix.dev/conda-forge"]
name = "fr5-board-stacking"
platforms = [{ name = "linux-64-glibc234", platform = "linux-64", glibc = "2.34" }]
version = "0.1.0"

[dependencies]
ros-humble-desktop = ">=0.10.0,<0.11"
colcon-common-extensions = ">=0.3.0,<0.4"
ros-humble-moveit-ros-move-group = ">=2.5.10,<3"
ros-humble-moveit-configs-utils = ">=2.5.10,<3"
ros-humble-moveit-planners = ">=2.5.10,<3"
ros-humble-moveit-kinematics = ">=2.5.10,<3"
ros-humble-moveit-simple-controller-manager = ">=2.5.10,<3"
ros-humble-moveit-ros-visualization = ">=2.5.10,<3"
ros-humble-moveit-ros-warehouse = ">=2.5.10,<3"
ros-humble-moveit-setup-assistant = ">=2.5.10,<3"
ros-humble-ros2-control = ">=2.54.3,<3"
ros-humble-ros2-controllers = ">=2.54.1,<3"
ros-humble-xacro = ">=2.1.1,<3"
ros-humble-joint-state-publisher-gui = ">=2.4.0,<3"
compilers = ">=2.0.0,<3"
cmake = "<4"
ninja = ">=1.13.2,<2"
pkg-config = ">=0.29.2,<0.30"
sysroot_linux-64 = ">=2.34"
ros-humble-ros2bag = ">=0.15.17,<0.16"
ros-humble-rosbag2-transport = ">=0.15.17,<0.16"
ros-humble-rosbag2-storage-default-plugins = ">=0.15.17,<0.16"

[tasks]
demo = "ros2 launch fr5_bringup bringup.launch.py"
robot = "ros2 launch fr5_bringup bringup.launch.py use_fake_hardware:=false"
build = 'CXXFLAGS="$CXXFLAGS -include unistd.h" colcon build --symlink-install --paths external/frcobot_ros2/fairino_description external/frcobot_ros2/fairino_msgs external/frcobot_ros2/fairino_hardware_v3_9_0_1 external/frcobot_ros2/fairino5_v6_moveit2_config src/fr5_bringup src/fr5_gripper'


[activation]
scripts = ["install/setup.sh"]

[activation.env]
LD_LIBRARY_PATH = "$PIXI_PROJECT_ROOT/external/frcobot_ros2/fairino_hardware_v3_9_0_1/libfairino/lib:$LD_LIBRARY_PATH"

# Camera SDK wheels use a separate Python environment from the team's ROS stack.
[feature.perception.dependencies]
python = "3.12.*"
numpy = ">=1.26,<3"
py-opencv = ">=4.10,<5"

[feature.perception.pypi-dependencies]
pyrealsense2 = ">=2.56,<3"
fr5-perception = { path = "src/fr5_perception", editable = true }

[feature.perception.tasks]
hardware = "python scripts/check_perception_hardware.py inventory"
check-logitech = "python scripts/check_perception_hardware.py logitech"
check-d405 = "python scripts/check_perception_hardware.py d405"
test-perception = "python -m unittest discover -s tests -v"

[feature.gpu.pypi-dependencies]
torch = { version = "==2.7.1", index = "https://download.pytorch.org/whl/cu128" }

[feature.gpu.tasks]
check-cuda = "python scripts/check_perception_hardware.py cuda"

# Standard ROS camera tools, isolated from motion and GPU environments.
[feature.camera-ros.dependencies]
# Humble's ChArUco solver uses an API removed in OpenCV 5.
py-opencv = ">=4.10,<5"
# Its Save backend uses ndarray.tostring, removed in NumPy 2.3.
numpy = ">=2,<2.3"
ros-humble-ros2cli-common-extensions = "*"
ros-humble-camera-calibration = "*"
ros-humble-v4l2-camera = "*"
ros-humble-image-proc = "*"
ros-humble-image-view = "*"
ros-humble-realsense2-camera = "*"

[feature.camera-ros.tasks]
cameras = "ros2 launch config/cameras.launch.py"
scene-camera = "ros2 run v4l2_camera v4l2_camera_node --ros-args -r __ns:=/scene --params-file config/logitech_ros.yaml"
wrist-camera = "ros2 launch realsense2_camera rs_launch.py camera_name:=wrist_camera camera_namespace:=wrist device_type:=D405 config_file:=config/d405_ros.yaml"
calibrate-scene = "ros2 launch config/scene_calibration.launch.py"
calibrate-wrist = "ros2 launch config/scene_calibration.launch.py camera:=wrist"
test-ros-calibration = "python -m unittest discover -s tests -p test_ros_calibration.py -v"
view-cameras = "ros2 launch config/camera_views.launch.py"
view-scene = "ros2 run image_view image_view --ros-args -r image:=/scene/image_raw"
view-wrist = "ros2 run image_view image_view --ros-args -r image:=/wrist/wrist_camera/color/image_raw"
view-depth = "ros2 run image_view image_view --ros-args -r image:=/wrist/wrist_camera/aligned_depth_to_color/image_raw -p autosize:=true"

[environments]
perception = { features = ["perception"], no-default-feature = true }
perception-gpu = { features = ["perception", "gpu"], no-default-feature = true }
camera-ros = { features = ["camera-ros"], no-default-feature = true }
