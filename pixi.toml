[workspace]
name = "fr5-vision1-overhead"
channels = ["https://prefix.dev/robostack-humble", "https://prefix.dev/conda-forge"]
platforms = [{ name = "linux-64-glibc234", platform = "linux-64", glibc = "2.34" },
             # train env only: RTX 50xx (Blackwell, sm_120) needs CUDA >= 12.8 torch builds
             { name = "linux-64-cuda", platform = "linux-64", glibc = "2.34", cuda = "12.8" }]
version = "0.1.0"

[tasks]
# Live overhead camera -> /vision/boards (JSON). Override: pixi run vision --ros-args -p device:=samples/01.jpg
vision = "python vision1/node.py"
# Offline: detect on one image, print JSON, write <image>.overlay.jpg
detect = "python vision1/detect.py"
check = "python vision1/check_samples.py"
eval = "python vision1/eval_dataset.py"
listen = "python vision1/listen.py"
conversation = "python conversation/bridge.py"
conversation-check = "python -m unittest discover -s conversation/tests -v"
# Wrist RealSense D405 -> /wrist/wrist_camera/... (color, depth, point cloud), placed on the robot model
wrist = "ros2 launch vision1/wrist.launch.py"

[dependencies]
ros-humble-ros-base = ">=0.10.0,<0.11"
py-opencv = ">=4.10,<5"
numpy = "*"
onnxruntime = "*"   # runs the exported model in the ROS node (CPU, no torch needed)
ros-humble-realsense2-camera = ">=4.57.7,<5"

# Training only (GPU): pixi run -e train ...  Kept out of the ROS env: torch is ~3 GB and needs an NVIDIA driver.
[feature.train]
platforms = ["linux-64-cuda"]

[feature.train.dependencies]
python = "3.12.*"
pytorch-gpu = "*"
torchvision = "*"
ultralytics = "*"
onnx = "*"
onnxslim = "*"

[feature.train.tasks]
gpu-check = "python -c 'import torch, ultralytics; print(torch.__version__, torch.version.cuda, torch.cuda.get_device_name(0), ultralytics.__version__)'"

# GPU inference for the ROS node (NVIDIA): pixi run -e gpu vision ...  ~20x faster than CPU for the model
[feature.gpu]
platforms = ["linux-64-cuda"]

[feature.gpu.dependencies]
onnxruntime = { version = "*", build = "*cuda*" }

[feature.train.pypi-dependencies]
transformers = ">=4.57,<5"
accelerate = ">=1,<2"
faster-whisper = ">=1.1,<2"
ptts = "==0.5.0"

[environments]
train = { features = ["train"], no-default-feature = true }
gpu = { features = ["gpu"] }
speech = { features = ["speech"], no-default-feature = true }

[feature.speech]
platforms = ["linux-64-cuda"]

[feature.speech.dependencies]
python = "3.12.*"
pytorch-gpu = "*"
torchvision = "*"

[feature.speech.pypi-dependencies]
transformers = ">=5.7,<6"
librosa = ">=0.11,<0.12"
accelerate = ">=1,<2"
faster-whisper = ">=1.1,<2"
ptts = "==0.5.0"
