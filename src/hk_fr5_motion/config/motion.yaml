# motion_controller parameters (ROS parameter file). Metres / radians / seconds.
/**/motion_controller:
  ros__parameters:
    group: arm                        # MoveIt planning group (SRDF)
    tcp_link: tcp                     # all targets are for this link (F2)
    base_frame: base_link             # all poses in this frame (F1)
    move_group_action: /move_action   # MoveIt MoveGroup action
    default_velocity_scaling: 0.2     # used when a goal sends 0 (F14), also for acceleration
    planning_time: 1.0                # s per planning attempt (T-11: plans take 12-70 ms; failures report in 1 s)
    planning_attempts: 1              # MoveIt num_planning_attempts
    replan_retries: 2                 # extra planning tries on PLANNING_FAILED / INVALID_MOTION_PLAN (T11)
    position_tolerance: 0.0001        # m, goal sphere radius (T-10: tight, no planning-time cost)
    orientation_tolerance: 0.001      # rad per axis, ~0.06 deg (T-10)
    joint_tolerance: 0.0001           # rad per joint, named_target goals (T-10; 0.01 gave 4-6 mm at the tcp)
    server_timeout: 10.0              # s to wait for move_group
    state_timeout: 1.0                # s, max age of the latest /joint_states
    # arm controller's trajectory action status: its EXECUTING goal -> our EXECUTING phase (T-7)
    trajectory_status_topic: /arm_controller/follow_joint_trajectory/_action/status
    # smooth stop on cancel / preempt (decision-log 5j): MoveIt Humble ignores cancel, so we send the
    # arm controller a deceleration trajectory from its latest commanded state
    controller_action: /arm_controller/follow_joint_trajectory
    controller_state_topic: /arm_controller/controller_state
    # deceleration a = clamp(v_max^2 / (2 * stop_max_coast), stop_deceleration, stop_deceleration_max) (V-7)
    stop_deceleration: 2.0            # rad/s^2, normal speeds (= joint acc limit; T9)
    stop_max_coast: 0.1               # rad, max travel of the fastest joint while stopping (until the cap)
    stop_deceleration_max: 5.0        # rad/s^2, cap at high speed (hard stop would be ~31)
    stop_min_time: 0.05               # s, shortest stop trajectory
