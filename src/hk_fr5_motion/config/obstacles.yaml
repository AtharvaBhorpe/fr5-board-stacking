# Static collision boxes for MoveIt, all in base_link, metres / radians.
# position = box centre. Values = teammate's workcell.yaml; table height MEASURED 2026-10-27 (decision-log H-10):
# table top -> robot base = 40 mm aluminium profile + 20 mm spacer = 60 mm. Table x/y and camera_post = estimates
# (T4). Boxes keep 1 mm gaps to the robot so MoveIt never sees permanent contacts.
#
# table_top_z = -0.060 (measured): table surface relative to base_link. If it changes, update:
#   table.position.z       = table_top_z - table.size.z / 2
#   profile.size.z         = -table_top_z - 0.002
#   profile.position.z     = -0.001 - profile.size.z / 2
#   camera_post.position.z = table_top_z + 0.001 + camera_post.size.z / 2
#   floor_guard.position.z = table_top_z - 0.001 - floor_guard.size.z / 2
boxes:
  - name: table                 # table top slab, 1.00 (depth) x 2.00 (width) m
    size: [1.00, 2.00, 0.03]
    position: [-0.42, 0.03, -0.075]
    yaw: 0.0

  - name: profile               # 16 cm aluminium profile (40 mm) + spacer (20 mm, within the profile) under the robot
    size: [1.00, 0.16, 0.058]
    position: [-0.42, 0.0, -0.030]
    yaw: 0.0

  - name: camera_post           # overhead webcam; now a tripod a few cm beside the table, box kept (OK for demo)
    size: [0.10, 0.07, 1.70]
    position: [-0.87, 0.116, 0.791]
    yaw: 0.0

  - name: floor_guard           # virtual: keeps the arm above table level past the table edges
    size: [3.0, 3.0, 0.02]
    position: [0.0, 0.0, -0.071]
    yaw: 0.0
