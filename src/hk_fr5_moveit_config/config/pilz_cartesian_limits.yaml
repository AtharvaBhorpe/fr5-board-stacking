# Pilz LIN/CIRC Cartesian limits. Rotational acc/dec are derived.
# acc/dec lowered from Fairino's 2.25 / -5.0 to +-0.3 m/s^2 (decision L-7): Pilz checks the
# resulting joint motion against the UNSCALED joint acc limit (0.7 rad/s^2, joint_limits.yaml);
# with 2.25 even a 5 cm LIN at 0.2 scaling violated j3. Revisit with real FR5 joint limits (T9).
cartesian_limits:
  max_trans_vel: 1.0     # m/s
  max_trans_acc: 0.3     # m/s^2
  max_trans_dec: -0.3    # m/s^2 (must be negative)
  max_rot_vel: 1.57      # rad/s
