[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fr5-perception"
version = "0.1.0"
description = "Camera-only geometric perception for FR5 board stacking"
requires-python = ">=3.12"
dependencies = ["numpy"]

[project.scripts]
fr5-perception-inspect = "fr5_perception.inspect:main"
fr5-logitech-calibration = "fr5_perception.calibration:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fr5_perception*"]
